<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunlight Shop - ร้านค้าออนไลน์สุดล้ำ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
        }
        header {
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        header h1 {
            font-size: 24px;
        }
        .cart-btn {
            background: white;
            color: #ff7e5f;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .cart-btn:hover {
            background: #ffe5dd;
        }
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
            display: flex;
            gap: 30px;
        }
        .products-section {
            flex: 2;
        }
        .cart-section {
            flex: 1;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            height: fit-content;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0,0,0,0.1);
        }
        .product-img {
            width: 100%;
            height: 150px;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
            font-weight: bold;
        }
        .product-info {
            padding: 15px;
        }
        .product-info h3 {
            font-size: 18px;
            margin-bottom: 5px;
        }
        .product-info p {
            color: #e67e22;
            font-weight: bold;
            font-size: 16px;
        }
        .add-to-cart {
            width: 100%;
            background: #2ecc71;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .add-to-cart:hover {
            background: #27ae60;
        }
        .cart-section h2 {
            margin-bottom: 15px;
            font-size: 20px;
            border-bottom: 2px solid #f4f7f6;
            padding-bottom: 10px;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .cart-total {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            border-top: 2px solid #f4f7f6;
            padding-top: 10px;
            display: flex;
            justify-content: space-between;
        }
        .checkout-btn {
            width: 100%;
            background: #3498db;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            margin-top: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .checkout-btn:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>

    <header>
        <h1>🛒 Sunlight Shop Hub</h1>
        <button class="cart-btn" onclick="toggleCartModal()">ตะกร้าสินค้า (<span id="cart-count">0</span>)</button>
    </header>

    <div class="container">
        <!-- รายการสินค้า -->
        <div class="products-section">
            <h2 style="margin-bottom: 20px;">สินค้าทั้งหมด</h2>
            <div class="product-grid" id="product-grid">
                <!-- โค้ดสินค้าจะถูกสร้างผ่าน JavaScript -->
            </div>
        </div>

        <!-- ตะกร้าสินค้า -->
        <div class="cart-section">
            <h2>ตะกร้าของคุณ</h2>
            <div id="cart-items">
                <p style="color: #888; text-align: center;">ยังไม่มีสินค้าในตะกร้า</p>
            </div>
            <div class="cart-total">
                <span>รวมทั้งหมด:</span>
                <span id="total-price">0 บาท</span>
            </div>
            <button class="checkout-btn" onclick="checkout()">ชำระเงิน</button>
        </div>
    </div>

    <script>
        // ข้อมูลสินค้าตัวอย่าง
        const products = [
            { id: 1, name: "Sunlight Script V1", price: 350, image: "Script 1" },
            { id: 2, name: "Roblox UI Design Pack", price: 500, image: "UI Pack" },
            { id: 3, name: "Python Automation Bot", price: 1200, image: "Bot Code" },
            { id: 4, name: "Discord Security System", price: 890, image: "Security" }
        ];

        let cart = [];

        // ฟังก์ชันแสดงสินค้าหน้าเว็บ
        function renderProducts() {
            const grid = document.getElementById("product-grid");
            grid.innerHTML = "";
            products.forEach(product => {
                grid.innerHTML += `
                    <div class="product-card">
                        <div>
                            <div class="product-img">${product.image}</div>
                            <div class="product-info">
                                <h3>${product.name}</h3>
                                <p>${product.price} บาท</p>
                            </div>
                        </div>
                        <button class="add-to-cart" onclick="addToCart(${product.id})">เพิ่มลงตะกร้า</button>
                    </div>
                `;
            });
        }

        // เพิ่มสินค้าลงตะกร้า
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const cartItem = cart.find(item => item.id === productId);

            if (cartItem) {
                cartItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            updateCart();
        }

        // อัปเดตการแสดงผลในตะกร้า
        function updateCart() {
            const cartItemsContainer = document.getElementById("cart-items");
            const cartCount = document.getElementById("cart-count");
            const totalPriceElement = document.getElementById("total-price");

            cartItemsContainer.innerHTML = "";
            let total = 0;
            let totalCount = 0;

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p style="color: #888; text-align: center;">ยังไม่มีสินค้าในตะกร้า</p>';
            } else {
                cart.forEach(item => {
                    total += item.price * item.quantity;
                    totalCount += item.quantity;
                    cartItemsContainer.innerHTML += `
                        <div class="cart-item">
                            <span>${item.name} (x${item.quantity})</span>
                            <span>${item.price * item.quantity} บาท</span>
                        </div>
                    `;
                });
            }

            cartCount.innerText = totalCount;
            totalPriceElement.innerText = total + " บาท";
        }

        // จำลองการชำระเงิน
        function checkout() {
            if (cart.length === 0) {
                alert("กรุณาเลือกสินค้าก่อนชำระเงินครับคุณพี่!");
                return;
            }
            alert("สั่งซื้อสินค้าเรียบร้อยแล้ว ขอบคุณที่ใช้บริการ Sunlight Shop ครับ! 🎉");
            cart = [];
            updateCart();
        }

        // รันฟังก์ชันแสดงสินค้าเมื่อโหลดหน้าเว็บ
        renderProducts();
    </script>
</body>
</html>
