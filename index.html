<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>AI Logo Gallery</title>
<style>
  :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #e6edf3; }
  body.light { --bg: #ffffff; --card: #f6f8fa; --border: #d0d7de; --text: #1f2328; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 20px; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    transition: background .3s, color .3s;
  }
  .header { max-width: 1200px; margin: 0 auto 32px; display: flex; justify-content: space-between; align-items: center; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; }
  .toggle { background: var(--card); border: 1px solid var(--border); color: var(--text);
            padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  .toggle:hover { opacity: .8; }
  .grid { max-width: 1200px; margin: 0 auto; display: grid;
          grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 24px 16px; display: flex; flex-direction: column; align-items: center; gap: 16px;
    transition: transform .2s, border-color .2s;
  }
  .card:hover { transform: translateY(-4px); border-color: #58a6ff; }
  .logo { width: 72px; height: 72px; display: flex; align-items: center; justify-content: center; }
  .logo svg { width: 100%; height: 100%; }
  .name { font-size: 14px; font-weight: 500; text-align: center; }
  .brand-openai .logo svg path { fill: #10a37f; }
  .brand-claude svg { color: #D97757; }
  .brand-grok .logo svg path { fill: #fff; }
  body.light .brand-grok .logo svg path { fill: #000; }
  .brand-qwen svg path { fill: #615CED; }
</style>
</head>
